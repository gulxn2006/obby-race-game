<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SkyDash Obby Race</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial;background:#87ceeb}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 8px #17255480} .brand{position:absolute;top:18px;left:20px;font-weight:900;font-size:clamp(18px,3vw,28px);letter-spacing:.5px}.brand span{color:#ffdf5d}.panel{position:absolute;top:18px;right:18px;background:#101b3ccc;border:1px solid #ffffff40;border-radius:15px;padding:12px 16px;backdrop-filter:blur(10px);font-size:13px;line-height:1.6}.center{position:absolute;top:18%;left:50%;transform:translateX(-50%);text-align:center;width:min(90%,560px)}#message{font-weight:900;font-size:clamp(23px,5vw,44px);letter-spacing:1px}.sub{font-size:14px;margin-top:7px;font-weight:600}.bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#101b3ccc;border:1px solid #ffffff40;border-radius:14px;padding:10px 18px;font-size:13px;white-space:nowrap}.bottom b{color:#ffe66d}#start{pointer-events:auto;border:0;border-radius:12px;background:linear-gradient(135deg,#ffcf4a,#ff8b37);color:#1d2850;font-weight:900;font-size:16px;padding:12px 22px;margin-top:15px;cursor:pointer;box-shadow:0 6px 0 #c55d2d}.touch{position:fixed;bottom:24px;display:none;gap:10px;pointer-events:auto}.touch button{width:58px;height:58px;border-radius:18px;border:1px solid #ffffff80;background:#101b3caa;color:white;font-size:24px;font-weight:bold;touch-action:none}.left{left:18px}.right{right:18px}#toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);font-weight:800;background:#101b3cdd;border-radius:12px;padding:9px 15px;display:none}@media(max-width:700px){.touch{display:flex}.bottom{bottom:100px;font-size:11px}.panel{font-size:11px;padding:8px 10px}.brand{top:12px;left:12px}.panel{top:12px;right:12px}}
</style></head>
<body>
<div id="hud"><div class="brand">☁️ SKY<span>DASH</span> <small style="font-size:11px;opacity:.85">OBBY RACE</small></div><div class="panel">🌐 <b id="online">1</b> online<br>📍 Checkpoint: <b id="cp">START</b><br>🏁 <b id="status">Ready to race</b></div><div class="center"><div id="message">READY, RUNNER?</div><div class="sub" id="hint">Race across the sky. Don't fall!</div><button id="start">▶ START RACE</button></div><div id="toast"></div><div class="bottom">Move <b>WASD / Arrow Keys</b> · Jump <b>Space</b> · Reset <b>R</b></div></div>
<div class="touch left"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="touch right"><button data-key="jump">⬆</button></div>
<script src="/socket.io/socket.io.js"></script><script type="module" src="/game.js"></script>
</body></html>
